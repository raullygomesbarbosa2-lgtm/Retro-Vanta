name: Build RetroRaiz APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RetroRaiz build files
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fetch pinned Lemuroid source and emulator cores
        run: |
          git clone https://github.com/Swordfish90/Lemuroid.git upstream
          git -C upstream checkout --detach 93e321d08f3dc0776bb0545da975d2cd7cd1f78f
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply RetroRaiz branding and system allowlist
        run: python3 scripts/patch_upstream.py upstream

      - name: Build debug APK with bundled cores
        run: |
          chmod +x upstream/gradlew
          cd upstream
          ./gradlew --no-daemon assembleFreeBundleDebug

      - name: Prepare APK
        run: |
          apk_path="$(find upstream/lemuroid-app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk_path" ]; then
            echo 'APK output not found' >&2
            exit 1
          fi
          cp "$apk_path" RetroRaiz.apk

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroRaiz-APK
          path: RetroRaiz.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: retroraiz-${{ github.run_number }}
          name: RetroRaiz APK ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: RetroRaiz.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
